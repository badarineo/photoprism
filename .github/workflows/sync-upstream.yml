name: Sync Fork with Upstream

# Run this workflow on the 14th day of every month at 12:00 AM UTC
on:
  schedule:
    - cron: '0 0 14 * *'
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync latest commits from upstream repository
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        # Checkout the develop branch (adjust if your default branch is different)
        ref: develop
        # Fetch full history to enable proper merging
        fetch-depth: 0
        # Use a personal access token to enable pushing
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
    
    - name: Add upstream repository
      run: |
        git remote add upstream https://github.com/photoprism/photoprism.git
        git remote -v
    
    - name: Fetch upstream changes
      run: |
        git fetch upstream
        git fetch origin
    
    - name: Check for conflicts and merge
      id: merge
      run: |
        # Try to merge upstream changes
        echo "Attempting to merge upstream/develop into develop..."
        
        # Check if we can merge without conflicts
        if git merge-tree $(git merge-base develop upstream/develop) develop upstream/develop | grep -q "<<<<<<< "; then
          echo "merge_status=conflict" >> $GITHUB_OUTPUT
          echo "❌ Merge conflicts detected. Manual intervention required."
          exit 1
        else
          # No conflicts, proceed with merge
          git merge upstream/develop --no-edit
          echo "merge_status=success" >> $GITHUB_OUTPUT
          echo "✅ Successfully merged upstream changes"
        fi
    
    - name: Push changes
      if: steps.merge.outputs.merge_status == 'success'
      run: |
        git push origin develop
        echo "✅ Changes pushed to fork successfully"
    
    - name: Create Issue on Conflict
      if: failure() && steps.merge.outputs.merge_status == 'conflict'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Upstream Sync Failed - Merge Conflicts Detected',
            body: `## 🔄 Automatic Upstream Sync Failed
            
            The monthly upstream sync workflow failed due to merge conflicts.
            
            **Details:**
            - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - **Branch:** develop
            - **Upstream:** https://github.com/photoprism/photoprism.git
            
            **Required Action:**
            Manual intervention is needed to resolve the merge conflicts. Please:
            
            1. Clone the repository locally
            2. Add upstream remote: \`git remote add upstream https://github.com/photoprism/photoprism.git\`
            3. Fetch upstream: \`git fetch upstream\`
            4. Merge upstream: \`git merge upstream/develop\`
            5. Resolve conflicts manually
            6. Push the resolved changes
            
            This issue will be automatically closed when the next successful sync occurs.`,
            labels: ['automation', 'sync-conflict']
          })
    
    - name: Close previous conflict issues on success
      if: steps.merge.outputs.merge_status == 'success'
      uses: actions/github-script@v7
      with:
        script: |
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'sync-conflict',
            state: 'open'
          });
          
          for (const issue of issues.data) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: '✅ Upstream sync has been resolved. This issue is now closed automatically.'
            });
            
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
          }